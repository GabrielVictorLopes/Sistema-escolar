<div class="layout">

  <!-- BOTÃO MENU -->
  <button
    class="menu-toggle"
    (click)="menuAberto = !menuAberto">

    ☰

  </button>

  <!-- OVERLAY -->
  <div
    class="overlay"
    *ngIf="menuAberto"
    (click)="menuAberto = false">
  </div>

  <!-- SIDEBAR -->
  <aside
    class="sidebar"
    [class.open]="menuAberto">

    <div class="sidebar-brand">
      <a
        routerLink="/home"
        class="sidebar-home-link"
        aria-label="Ir para a página inicial">

        <img
          src="/logo_2.png"
          alt="Logo SOCE"
          class="sidebar-logo" />

      </a>
    </div>

    <div class="menu-group">
      <h3>Cadastros-teste</h3>

      <a routerLink="/aluno" (click)="menuAberto = false">
        Cadastro de Aluno
      </a>

      <a routerLink="/professor" (click)="menuAberto = false">
        Cadastro de Professor
      </a>

      <a routerLink="/fornecedor" (click)="menuAberto = false">
        Cadastro de Fornecedor
      </a>
    </div>

    <div class="menu-group">
      <h3>Notas / Faltas</h3>

      <a routerLink="/notas" (click)="menuAberto = false">
        Lançar Notas
      </a>

      <a routerLink="/faltas" (click)="menuAberto = false">
        Lançar Faltas
      </a>
    </div>

    <div class="menu-group">
      <h3>Financeiro</h3>

      <a routerLink="/contas-receber" (click)="menuAberto = false">
        Contas a Receber
      </a>

      <a routerLink="/contas-pagar" (click)="menuAberto = false">
        Contas a Pagar
      </a>

      <a routerLink="/nota-fiscal" (click)="menuAberto = false">
        Nota Fiscal
      </a>
    </div>

  </aside>

  <!-- CONTEÚDO -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

</div>
