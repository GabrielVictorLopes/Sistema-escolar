<div class="container">

  <h1>Cadastro de Aluno</h1>

  <div class="form-grid">

    <div class="form-group">
      <label>Nome do Aluno</label>
      <input
        type="text"
        [(ngModel)]="nome"
        (keypress)="apenasLetras($event)"
        placeholder="Insira o nome completo do aluno"
      />
    </div>

    <div class="form-group">
      <label>CPF</label>
      <input
        type="text"
        [(ngModel)]="cpf"
        maxlength="11"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira seu CPF sem pontos ou traços"
      />
    </div>

    <div class="form-group">
      <label>RG</label>
      <input
        type="text"
        [(ngModel)]="rg"
        maxlength="9"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira seu RG sem pontos ou traços"
      />
    </div>

    <div class="form-group">
      <label>Sexo</label>
      <select [(ngModel)]="sexo">
        <option value="">Selecione</option>
        <option value="F">Feminino</option>
        <option value="M">Masculino</option>
      </select>
    </div>

    <div class="form-group">
      <label>Nome da Mãe</label>
      <input
        type="text"
        [(ngModel)]="nomeMae"
        (keypress)="apenasLetras($event)"
        placeholder="Insira o nome completo da mãe"
      />
    </div>

    <div class="form-group">
      <label>Telefone da Mãe</label>
      <input
        type="text"
        [(ngModel)]="telMae"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o telefone da mãe"
      />
    </div>

    <div class="form-group">
      <label>Nome do Pai</label>
      <input
        type="text"
        [(ngModel)]="nomePai"
        (keypress)="apenasLetras($event)"
        placeholder="Insira o nome completo do pai"
      />
    </div>

    <div class="form-group">
      <label>Telefone do Pai</label>
      <input
        type="text"
        [(ngModel)]="telPai"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o telefone do pai"
      />
    </div>

    <div class="form-group">
      <label>Medicamento?</label>
      <select [(ngModel)]="medicamento">
        <option value="">Selecione</option>
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
      </select>
    </div>

    <div class="form-group">
      <label>Observação</label>
      <textarea
        [(ngModel)]="observacao">
      </textarea>
    </div>

    <div class="form-group">
      <label>Rua</label>
      <input
        type="text"
        [(ngModel)]="rua"
        (keypress)="apenasLetras($event)"
        placeholder="Insira a rua onde o aluno reside"
      />
    </div>

    <div class="form-group">
      <label>Bairro</label>
      <input
        type="text"
        [(ngModel)]="bairro"
        (keypress)="apenasLetras($event)"
        placeholder="Insira o bairro onde o aluno reside"
      />
    </div>

    <div class="form-group">
      <label>Número</label>
      <input
        type="text"
        [(ngModel)]="numero"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o número da residência do aluno"
      />
    </div>

    <div class="form-group">
      <label>CEP</label>
      <input
        type="text"
        maxlength="8"
        [(ngModel)]="cep"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o CEP da residência do aluno"
      />
    </div>

    <div class="form-group">
      <label>Complemento</label>
      <input
        type="text"
        [(ngModel)]="complemento"
        placeholder="Insira um complemento para o endereço, se necessário"
      />
    </div>

  </div>

  <div class="buttons">
    <button (click)="cadastrar()">
      Cadastrar
    </button>

    <button (click)="cancelar()">
      Cancelar
    </button>
  </div>

</div>
