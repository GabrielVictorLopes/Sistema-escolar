<div class="container">

  <h1>Cadastro de Professor</h1>

  <div class="form-grid">

    <div class="form-group">
      <label>Nome</label>
      <input
        type="text"
        [(ngModel)]="nome"
        (keypress)="apenasLetras($event)"
        Placeholder="Insira o nome completo do professor"
      />
    </div>

    <div class="form-group">
      <label>CPF</label>
      <input
        type="text"
        maxlength="11"
        [(ngModel)]="cpf"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o CPF do professor sem pontos ou traços"
      />
    </div>

    <div class="form-group">
      <label>RG</label>
      <input
        type="text"
        maxlength="9"
        [(ngModel)]="rg"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o RG do professor sem pontos ou traços"
      />
    </div>

    <div class="form-group">
      <label>Sexo</label>
      <select [(ngModel)]="sexo">
        <option value="">Selecione</option>
        <option value="F">Feminino</option>
        <option value="M">Masculino</option>
      </select>
    </div>

    <div class="form-group">
      <label>Telefone</label>
      <input
        type="text"
        [(ngModel)]="telefone"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o telefone do professor"
      />
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Insira o e-mail do professor"
      />
    </div>

    <div class="form-group">
      <label>Disciplina</label>
      <input
        type="text"
        [(ngModel)]="disciplina"
        (keypress)="apenasLetras($event)"
        placeholder="Insira a disciplina que o professor leciona"
      />
    </div>

    <div class="form-group">
      <label>Formação</label>
      <input
        type="text"
        [(ngModel)]="formacao"
        placeholder="Insira a formação do professor"
      />
    </div>

    <div class="form-group">
      <label>Rua</label>
      <input
        type="text"
        [(ngModel)]="rua"
        placeholder="Insira a rua onde o professor reside"
      />
    </div>

    <div class="form-group">
      <label>Bairro</label>
      <input
        type="text"
        [(ngModel)]="bairro"
        placeholder="Insira o bairro onde o professor reside"
      />
    </div>

    <div class="form-group">
      <label>Número</label>
      <input
        type="text"
        [(ngModel)]="numero"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o número da residência do professor"
      />
    </div>

    <div class="form-group">
      <label>CEP</label>
      <input
        type="text"
        maxlength="8"
        [(ngModel)]="cep"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o CEP da residência do professor"
      />
    </div>

    <div class="form-group">
      <label>Complemento</label>
      <input
        type="text"
        [(ngModel)]="complemento"
        placeholder="Insira um complemento para o endereço, se necessário"
      />
    </div>

  </div>

  <div class="buttons">
    <button (click)="cadastrar()">
      Cadastrar
    </button>

    <button (click)="cancelar()">
      Cancelar
    </button>
  </div>

</div>
