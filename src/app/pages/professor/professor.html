<div class="container">

  <h1>Cadastro de Professor</h1>

  <div class="form-grid">

    <input
      type="text"
      placeholder="Nome"
      [(ngModel)]="nome"
      (keypress)="apenasLetras($event)"
    />

    <input
      type="text"
      placeholder="CPF"
      maxlength="11"
      [(ngModel)]="cpf"
      (keypress)="apenasNumeros($event)"
    />

    <input
      type="text"
      placeholder="RG"
      maxlength="9"
      [(ngModel)]="rg"
      (keypress)="apenasNumeros($event)"
    />

    <select [(ngModel)]="sexo">
      <option value="">Sexo</option>
      <option value="F">Feminino</option>
      <option value="M">Masculino</option>
    </select>

    <input
      type="text"
      placeholder="Telefone"
      [(ngModel)]="telefone"
      (keypress)="apenasNumeros($event)"
    />

    <input
      type="email"
      placeholder="E-mail"
      [(ngModel)]="email"
    />

    <input
      type="text"
      placeholder="Disciplina"
      [(ngModel)]="disciplina"
    />

    <input
      type="text"
      placeholder="Formação"
      [(ngModel)]="formacao"
    />

    <input
      type="text"
      placeholder="Rua"
      [(ngModel)]="rua"
    />

    <input
      type="text"
      placeholder="Bairro"
      [(ngModel)]="bairro"
    />

    <input
      type="text"
      placeholder="Número"
      [(ngModel)]="numero"
    />

    <input
      type="text"
      placeholder="CEP"
      maxlength="8"
      [(ngModel)]="cep"
      (keypress)="apenasNumeros($event)"
    />

    <input
      type="text"
      placeholder="Complemento"
      [(ngModel)]="complemento"
    />

  </div>

  <div class="buttons">
    <button (click)="cadastrar()">
      Cadastrar
    </button>

    <button (click)="cancelar()">
      Cancelar
    </button>
  </div>

</div>
