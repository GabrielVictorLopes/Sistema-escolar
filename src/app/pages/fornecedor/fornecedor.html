<div class="container">

  <h1>Cadastro de Fornecedor</h1>

  <div class="form-grid">

    <div class="form-group">
      <label>Nome da Empresa</label>
      <input
        type="text"
        [(ngModel)]="empresa"
      />
    </div>

    <div class="form-group">
      <label>CNPJ</label>
      <input
        type="text"
        maxlength="14"
        [(ngModel)]="cnpj"
        (keypress)="apenasNumeros($event)"
      />
    </div>

    <div class="form-group">
      <label>Responsável</label>
      <input
        type="text"
        [(ngModel)]="responsavel"
        (keypress)="apenasLetras($event)"
      />
    </div>

    <div class="form-group">
      <label>Telefone</label>
      <input
        type="text"
        [(ngModel)]="telefone"
        (keypress)="apenasNumeros($event)"
      />
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input
        type="email"
        [(ngModel)]="email"
      />
    </div>

    <div class="form-group">
      <label>Produto / Serviço</label>
      <input
        type="text"
        [(ngModel)]="produto"
      />
    </div>

    <div class="form-group full-width">
      <label>Observações</label>
      <textarea
        [(ngModel)]="observacao">
      </textarea>
    </div>

    <div class="form-group">
      <label>Rua</label>
      <input
        type="text"
        [(ngModel)]="rua"
      />
    </div>

    <div class="form-group">
      <label>Bairro</label>
      <input
        type="text"
        [(ngModel)]="bairro"
      />
    </div>

    <div class="form-group">
      <label>Número</label>
      <input
        type="text"
        [(ngModel)]="numero"
        (keypress)="apenasNumeros($event)"
      />
    </div>

    <div class="form-group">
      <label>CEP</label>
      <input
        type="text"
        maxlength="8"
        [(ngModel)]="cep"
        (keypress)="apenasNumeros($event)"
      />
    </div>

    <div class="form-group">
      <label>Complemento</label>
      <input
        type="text"
        [(ngModel)]="complemento"
      />
    </div>

  </div>

  <div class="buttons">

    <button (click)="cadastrar()">
      Cadastrar
    </button>

    <button (click)="cancelar()">
      Cancelar
    </button>

  </div>

</div>
