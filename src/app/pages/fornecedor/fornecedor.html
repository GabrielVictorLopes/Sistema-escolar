<div class="container">

  <h1>Cadastro de Fornecedor</h1>

  <div class="form-grid">

    <div class="form-group">
      <label>Nome da Empresa</label>
      <input
        type="text"
        [(ngModel)]="empresa"
        placeholder="Insira o nome da empresa fornecedora"
      />
    </div>

    <div class="form-group">
      <label>CNPJ</label>
      <input
        type="text"
        maxlength="14"
        [(ngModel)]="cnpj"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o CNPJ da empresa sem pontos ou traços"
      />
    </div>

    <div class="form-group">
      <label>Responsável</label>
      <input
        type="text"
        [(ngModel)]="responsavel"
        (keypress)="apenasLetras($event)"
        placeholder="Insira o nome completo do responsável pela empresa"
      />
    </div>

    <div class="form-group">
      <label>Telefone</label>
      <input
        type="text"
        [(ngModel)]="telefone"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o telefone da empresa"
      />
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Insira o e-mail da empresa"
      />
    </div>

    <div class="form-group">
      <label>Produto / Serviço</label>
      <input
        type="text"
        [(ngModel)]="produto"
        placeholder="Insira o produto ou serviço fornecido pela empresa"
      />
    </div>

    <div class="form-group">
      <label>Observações</label>
      <textarea
        [(ngModel)]="observacao">
      </textarea>
    </div>

    <div class="form-group">
      <label>Rua</label>
      <input
        type="text"
        [(ngModel)]="rua"
        placeholder="Insira a rua onde a empresa está localizada"
      />
    </div>

    <div class="form-group">
      <label>Bairro</label>
      <input
        type="text"
        [(ngModel)]="bairro"
        placeholder="Insira o bairro onde a empresa está localizada"
      />
    </div>

    <div class="form-group">
      <label>Número</label>
      <input
        type="text"
        [(ngModel)]="numero"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o número da residência da empresa"
      />
    </div>

    <div class="form-group">
      <label>CEP</label>
      <input
        type="text"
        maxlength="8"
        [(ngModel)]="cep"
        (keypress)="apenasNumeros($event)"
        placeholder="Insira o CEP da residência da empresa"
      />
    </div>

    <div class="form-group">
      <label>Complemento</label>
      <input
        type="text"
        [(ngModel)]="complemento"
        placeholder="Insira um complemento para o endereço, se necessário"
      />
    </div>

  </div>

  <div class="buttons">

    <button (click)="cadastrar()">
      Cadastrar
    </button>

    <button (click)="cancelar()">
      Cancelar
    </button>

  </div>

</div>
